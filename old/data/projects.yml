# ============================================================
# projects.yml — Edit this file to update the Research page
# ============================================================
# Each project has these fields:
#   title       (required)
#   status      current | completed
#   years       e.g. "2024 — ongoing" or "2021 — 2023"
#   funder      funding body or institution (optional)
#   partners    list of partner organisations (optional)
#   description short paragraph (required)
#   tags        list of keyword tags (optional)
#   image       path to image in images/ folder (optional)
#   links       list of {label, url} pairs (optional)
# ============================================================

current:
