    partners:
      - "TU Delft — Urban Data Science"
      - "[Partner organisation]"
      - "[Municipality name]"
    description: >
      [Describe the project here — what is the core research question?
      What methods are you using? What problem does it address and for whom?
      What will success look like? 2–4 sentences is ideal.]
    tags:
      - Urban Resilience
      - GIS
      - Climate Adaptation
      - Spatial Modeling
    image: "images/project-1.jpg"
    links:
      - label: "Project page"
        url: "#"
      - label: "GitHub"
        url: "#"

